[package]
name = "ibkr-companion"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { path = "D:/MCUi/_third_party/slint/api/rs/slint", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[build-dependencies]
slint-build = { path = "D:/MCUi/_third_party/slint/api/rs/build" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
