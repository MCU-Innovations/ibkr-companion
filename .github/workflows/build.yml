name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Slint revision
        shell: pwsh
        run: |
          $revision = (Get-Content slint-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Slint revision' }
          "SLINT_REVISION=$revision" >> $env:GITHUB_ENV
      - name: Check out Slint
        uses: actions/checkout@v4
        with:
          repository: slint-ui/slint
          ref: ${{ env.SLINT_REVISION }}
          path: third_party/slint
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-slint-${{ env.SLINT_REVISION }}
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-companion-windows-x64
          path: |
            target/release/ibkr-companion.exe
            README.md
            THIRD_PARTY.md
            third_party/slint/LICENSES/
            third_party/slint/ui-libraries/material/src/LICENSE.md
          if-no-files-found: error
          retention-days: 30
